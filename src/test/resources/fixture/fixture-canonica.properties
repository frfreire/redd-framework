# FIXTURE CANONICA de lote e tamanho de transacao para HOTSTUFF e TENDERMINT (HS-CB-fase2, B2, decisao D4).
#
# Lugar unico, lido por:
#   - testes Java: jabs.example.FixtureCanonica (classpath /fixture/fixture-canonica.properties)
#   - scripts:     scripts/jabs/fixture_canonica.py (le este arquivo pelo caminho do repositorio)
# Por que aqui: src/test/resources ja e onde moram as fixtures e as evidencias de nao regressao; o arquivo e texto
# puro (Java e Python leem sem dependencia); e NAO fica em src/main, para o codigo de producao nunca ter valor padrao
# de lote/tx-size (MVPComparison continua exigindo as flags --hs-* e --tm-* sem padrao; a trava so COMPARA).
#
# ESTES VALORES SAO FIXTURE DE TESTE. NAO SAO CALIBRACAO, NAO SAO VALOR DE PESQUISA E NAO FORAM MEDIDOS NO FABRIC.
# O lote e o tamanho de transacao da pesquisa: a definir com o humano (ADR-0010 PI-08/PI-16; ADR-0015 A-24/A-25).
# Escolha dos numeros: os que a maioria dos testes unitarios de HOTSTUFF e TENDERMINT ja usava (20 e 512).
batch-size=20
tx-size=512
